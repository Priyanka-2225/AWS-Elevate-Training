
version: 0.2

phases:
  install:
    commands:
      - echo "Preparing website"

  build:
    commands:
      - test -f aws-devops-website/index.html
      - test -f aws-devops-website/style.css
      - test -f aws-devops-website/script.js
      - echo "Website validation successful"

artifacts:
  base-directory: aws-devops-website
  files:
    - index.html
    - style.css
    - script.js
